; ========== UNIX HTTP 服务（supervisor 内部通信） ==========
[unix_http_server]
file=/tmp/supervisor.sock   ; UNIX 套接字路径，supervisor 通过它监听
chmod=0770                  ; 套接字文件权限
chown=ubuntu:ubuntu         ; 套接字文件所属用户和组

; ========== supervisord 主进程配置 ==========
[supervisord]
logfile=/dev/stdout         ; 主日志输出到标准输出
logfile_maxbytes=0          ; 日志文件大小无限制
loglevel=info               ; 日志级别
pidfile=/tmp/supervisord.pid ; PID 文件路径（PID = 1 是 supervisor 进程的 PID）
nodaemon=true               ; 前台运行（Docker 中必须）
minfds=1024                 ; 打开文件描述符的最小数量
minprocs=200                ; 进程数最小值
autoshutdown=true           ; 所有子进程退出后自动关闭 supervisord

; ========== RPC 接口（供 supervisorctl 等客户端调用） ==========
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ========== supervisorctl 客户端连接配置 ==========
[supervisorctl]
serverurl=unix:///tmp/supervisor.sock ; 通过 UNIX 套接字连接 supervisord

; ========== Xvfb 虚拟显示（无头环境下的 X11 显示） ==========
[program:xvfb]
command=bash -c "rm -f /tmp/.X1-lock && Xvfb :1 -screen 0 1280x1029x24"
autostart=true              ; 随 supervisord 自动启动
autorestart=true            ; 异常退出时自动重启
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0   ; 标准输出日志大小无限制
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0   ; 标准错误日志大小无限制
environment=DISPLAY=:1      ; 使用显示器 :1
priority=10                 ; 启动顺序（数字越小越先启动）

; ========== Google Chrome / Chromium 浏览器 ==========
[program:chrome]
command=chromium \
    --display=:1 \
    --window-size=1280,1029 \
    --start-maximized \
    --no-sandbox \
    --disable-dev-shm-usage \
    --disable-setuid-sandbox \
    --disable-accelerated-2d-canvas \
    --disable-gpu \
    --disable-features=WelcomeExperience,SigninPromo \
    --no-first-run \
    --no-default-browser-check \
    --disable-infobars \
    --test-type \
    --disable-popup-blocking \
    --disable-gpu-sandbox \
    --no-xshm \
    --new-window=false \
    --disable-notifications \
    --disable-extensions \
    --disable-component-extensions-with-background-pages \
    --disable-popup-blocking \
    --disable-prompt-on-repost \
    --disable-dialogs \
    --disable-modal-dialogs \
    --disable-web-security \
    --disable-site-isolation-trials \
    --remote-debugging-address=0.0.0.0 \
    --remote-debugging-port=8222 %(ENV_CHROME_ARGS)s
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DISPLAY=:1
priority=20                 ; 在 xvfb 之后启动
startretries=3              ; 启动失败时最多重试 3 次
startsecs=5                 ; 启动后保持 5 秒视为启动成功

; ========== socat 端口转发（将 9222 转发到 Chrome 调试端口 8222） ==========
[program:socat]
command=socat TCP-LISTEN:9222,bind=0.0.0.0,fork,reuseaddr TCP:127.0.0.1:8222
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30                 ; 在 chrome 之后启动
startsecs=2                 ; 启动后保持 2 秒视为启动成功

; ========== x11vnc 服务（将 X11 显示通过 VNC 暴露） ==========
[program:x11vnc]
command=x11vnc -display :1 -nopw -shared -listen 0.0.0.0 -xkb -forever -rfbport 5900
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DISPLAY=:1
priority=40                 ; 在 socat 之后启动
startsecs=3

; ========== Websockify（将 VNC 转为 WebSocket，便于浏览器访问） ==========
[program:websockify]
command=websockify 0.0.0.0:5901 localhost:5900
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=45                 ; 在 x11vnc 之后启动
startsecs=3

; ========== FastAPI 应用（主业务服务） ==========
[program:app]
command=uvicorn app.main:app --host 0.0.0.0 --port 8080 %(ENV_UVI_ARGS)s
directory=/app               ; 工作目录
user=ubuntu                  ; 运行用户
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME=/home/ubuntu
priority=50                  ; 最后启动，依赖前述服务

; ========== 服务组（可一次性启动/停止多个程序） ==========
[group:services]
programs=xvfb,chrome,socat,x11vnc,websockify,app
